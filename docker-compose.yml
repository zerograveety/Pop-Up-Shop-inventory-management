version: "3.9"

services:
  db:
    image: postgres:16
    container_name: inventory-management-db
    environment:
      POSTGRES_DB: InventoryManagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # schema.sql runs automatically on first initialization and seeds demo users
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d InventoryManagement"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
